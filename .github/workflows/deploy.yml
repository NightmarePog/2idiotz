name: Check and upload to Tour de Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourdecloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check backend
        working-directory: backend
        run: ./gradlew --no-daemon check
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm api:check
          pnpm test:api
          pnpm lint
          pnpm check
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Reject breaking API changes
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CONTRACT_BASE" ] || [ "$CONTRACT_BASE" = "0000000000000000000000000000000000000000" ]; then
            CONTRACT_BASE=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$CONTRACT_BASE^{commit}"
          if git cat-file -e "$CONTRACT_BASE:frontend/openapi.json" 2>/dev/null; then
            git show "$CONTRACT_BASE:frontend/openapi.json" > backend/build/openapi/base.json
            docker run --rm -v "$PWD:/specs:ro" tufin/oasdiff:v1.32.1 \
              breaking --fail-on WARN \
              /specs/backend/build/openapi/base.json /specs/frontend/openapi.json
          else
            echo 'No previous OpenAPI contract; this change establishes the baseline.'
          fi
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Check Caddy configuration
        run: docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Test application
        run: python3 scripts/smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down -v

  upload:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check deployment settings
        env:
          TDC_TOKEN: ${{ secrets.TDC_TOKEN }}
        run: |
          test -n "$TDC_TOKEN" || { echo 'Add repository secret TDC_TOKEN.'; exit 1; }
      - name: Upload to Tour de Cloud
        uses: studentscangrow/upload-app@v27
        with:
          tdc_token: ${{ secrets.TDC_TOKEN }}
