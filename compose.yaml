services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
  caddy:
    build: ./caddy
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: server:8080
      WEB_UPSTREAM: web:3001
    depends_on:
      - web
      - server

volumes:
  postgres_data:
