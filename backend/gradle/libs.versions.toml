[versions]
spring-boot = "4.1.1"
spotless = "7.0.4"
archunit = "1.4.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }
postgresql = { module = "org.postgresql:postgresql" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
